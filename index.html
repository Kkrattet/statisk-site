<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Season</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="logo">SEASON</a>

      <button class="nav-toggle" id="navToggle" aria-label="Åbn menu">☰</button>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Forside</a></li>
        <li><a href="produktliste.html">Kollektion</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section class="hero">
      <h1>SEASON</h1>
      <p>Clothes made for every season.</p>
    </section>

    <section class="sektion" id="saesoner">

      <h2>Sæsoner</h2>

      <div class="saeson-grid">
        <a class="saeson-kort" href="produktliste.html?season=Spring">
          <img src="img/Spring.png" alt="Forår" />
          <div class="saeson-tekst">
            <h3>Forår</h3>
            <p>Lette lag til lyse dage</p>
          </div>
        </a>
        <a class="saeson-kort" href="produktliste.html?season=Summer">
          <img src="img/Summer.png" alt="Sommer" />
          <div class="saeson-tekst">
            <h3>Sommer</h3>
            <p>Luftigt tøj til varme dage</p>
          </div>
        </a>
        <a class="saeson-kort" href="produktliste.html?season=Fall">
          <img src="img/Fall.png" alt="Efterår" />
          <div class="saeson-tekst">
            <h3>Efterår</h3>
            <p>Varme farver og bløde materialer</p>
          </div>
        </a>
        <a class="saeson-kort" href="produktliste.html?season=Winter">
          <img src="img/Winter.png" alt="Vinter" />
          <div class="saeson-tekst">
            <h3>Vinter</h3>
            <p>Tykke lag til kolde dage</p>
          </div>
        </a>
      </div>

    </section>

  </main>

  <footer class="site-footer">
    <a href="index.html" class="logo">SEASON</a>
    <p>© 2026 SEASON</p>
  </footer>

  <script>
    const navToggle = document.getElementById("navToggle");
    const navLinks = document.getElementById("navLinks");

    navToggle.addEventListener("click", () => {
      navLinks.classList.toggle("open");
    });
  </script>

</body>

</html>
